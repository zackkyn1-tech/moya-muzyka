name: Build & release APK

# Кожен push збирає APK і публікує його як новий реліз —
# додаток на телефоні бачить його і пропонує оновитися.
on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Version
        run: echo "VERSION_CODE=$(( GITHUB_RUN_NUMBER + 3 ))" >> "$GITHUB_ENV"

      - name: Signing key
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::Додай секрет SIGNING_KEY у Settings → Secrets and variables → Actions"
            exit 1
          fi
          # Формат секрету: пароль:ключ_у_base64 (один рядок)
          KEY=$(printf '%s' "$SIGNING_KEY" | tr -d ' \r\n')
          PW="${KEY%%:*}"
          echo "::add-mask::$PW"
          printf '%s' "${KEY#*:}" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "SIGNING_PASSWORD=$PW" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk Shron.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git log -1 --pretty=%B | grep -v -E '^(Co-Authored-By|Claude-Session):' > notes.txt
          gh release create "v${VERSION_CODE}" Shron.apk \
            --title "1.${VERSION_CODE}" \
            --notes-file notes.txt \
            --target "$GITHUB_SHA" \
            --latest
